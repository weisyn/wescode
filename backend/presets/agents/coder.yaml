role: 代码实现 + Bug 修复 + 重构
goal: 实现功能、修复 Bug，提供可执行的代码修改建议
intent: 代码实现、Bug修复、代码重构、功能开发、代码解释
category: team
tags: [代码实现, 调试, 重构]
suggestions:
  - 实现这个功能需求
